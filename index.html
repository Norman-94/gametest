<!DOCTYPE html>
<html lang="cs"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FPS</title>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
html,body{margin:0;height:100%;background:#111;overflow:hidden;color:#fff;font:14px system-ui,sans-serif}
[hidden]{display:none!important}
.ov{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:#1b2330;z-index:5}
.ov input,.ov button{font-size:18px;padding:10px 14px;border-radius:8px;border:0}
.ov button{background:#e8a317;font-weight:700;cursor:pointer}
canvas{display:block;width:100vw;height:100vh;object-fit:contain}
#s{position:fixed;top:8px;left:8px;background:#0008;padding:4px 10px;border-radius:6px}
#h{position:fixed;bottom:8px;left:8px;background:#0008;padding:4px 10px;border-radius:6px}
</style></head><body>
<div id="menu" class="ov">
  <h1>FPS</h1>
  <input id="room" placeholder="Název místnosti" maxlength="30" autocomplete="off">
  <button id="go">Hrát</button>
  <div style="font-size:13px;opacity:.8;max-width:340px;text-align:center">Kdo zadá stejný název, hraje ve stejné místnosti. Zvol něco unikátního.</div>
  <div id="err" style="color:#f77"></div>
</div>
<canvas id="c" width="1920" height="1080"></canvas>
<div id="s">Připojování…</div><div id="h">WASD / šipky · mezerník = střelba</div>
<script>
const W=1920,H=1080,S=40,SPD=300,BSPD=700;
let ROOM='',label='';
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),info=document.getElementById('s');
const COLS=['#e74c3c','#3498db','#2ecc71','#f1c40f','#9b59b6','#e67e22','#1abc9c','#fd79a8','#a29bfe','#dfe6e9'];
const DIRS={w:[0,-1],arrowup:[0,-1],s:[0,1],arrowdown:[0,1],a:[-1,0],arrowleft:[-1,0],d:[1,0],arrowright:[1,0]};
let peer=null,isHost=false,myId=null,hostConn=null,conns=[],retry=null,nextCol=0;
let players={},bullets=[],st={p:[],b:[]},disp={},stack=[],fire=false;

/* ovládání */
onkeydown=e=>{if(e.target.tagName==='INPUT')return;const k=e.key.toLowerCase();
  if(DIRS[k]||k===' ')e.preventDefault();
  if(k===' '){fire=true;return}
  if(DIRS[k]&&!stack.includes(k))stack.push(k)};
onkeyup=e=>{const k=e.key.toLowerCase();if(k===' ')fire=false;stack=stack.filter(x=>x!==k)};
onblur=()=>{stack=[];fire=false};
function inp(){const d=DIRS[stack[stack.length-1]]||[0,0];return{t:'in',dx:d[0],dy:d[1],f:fire?1:0}}
function setIn(p,m){p.dx=Math.sign(m.dx|0);p.dy=Math.sign(m.dy|0);if(p.dx&&p.dy)p.dy=0;p.f=m.f?1:0}

/* spojení: kdo získá ID místnosti jako první, je host; ostatní se připojí.
   Když host odejde, všichni to zkusí znovu a jeden z nich převezme roli. */
function reset(){
  isHost=false;conns=[];players={};bullets=[];hostConn=null;
  if(peer){try{peer.destroy()}catch(e){}}peer=null;
}
function again(){
  info.textContent='Připojování…';
  if(retry)return;
  retry=setTimeout(()=>{retry=null;connect()},1000+Math.random()*1500);
}
function connect(){
  reset();
  peer=new Peer(ROOM);
  peer.on('open',()=>{isHost=true;myId='host';addPlayer('host');info.textContent='Jsi hostitel · '+label});
  peer.on('connection',c=>{
    c.on('open',()=>{conns.push(c);addPlayer(c.peer)});
    c.on('data',m=>{if(m.t==='in'&&players[c.peer])setIn(players[c.peer],m)});
    const drop=()=>{conns=conns.filter(x=>x!==c);delete players[c.peer]};
    c.on('close',drop);c.on('error',drop);
  });
  peer.on('error',e=>{if(e.type==='unavailable-id')join();else again()});
}
function join(){
  reset();
  peer=new Peer();
  peer.on('error',again);
  peer.on('open',id=>{
    myId=id;
    hostConn=peer.connect(ROOM,{serialization:'json'});
    hostConn.on('open',()=>info.textContent='Připojen · '+label);
    hostConn.on('data',m=>{if(m.t==='s')st=m});
    hostConn.on('close',again);
  });
}
/* start: název místnosti se zadá jen jednou; při převzetí hostování zůstává stejný */
const $=id=>document.getElementById(id);
$('room').value=decodeURIComponent(location.hash.slice(1));
function start(){
  const n=$('room').value.trim().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,30);
  if(n.length<3)return $('err').textContent='Zadej název místnosti (aspoň 3 znaky).';
  label=n;ROOM='fps-'+n;location.hash=n;
  $('menu').hidden=true;connect();
}
$('go').onclick=start;
$('room').addEventListener('keydown',e=>{if(e.key==='Enter')start()});

/* hra (počítá host) */
function addPlayer(id){const p=players[id]={id,col:nextCol++%10,fx:0,fy:1,dx:0,dy:0,f:0,cd:0,rs:0};spawn(p)}
function spawn(p){p.x=S+Math.random()*(W-2*S);p.y=S+Math.random()*(H-2*S);p.hp=3;p.dead=0}
let last=Date.now();
setInterval(()=>{
  if(!isHost||!players.host)return;
  const now=Date.now(),dt=Math.min(0.1,(now-last)/1000);last=now;
  setIn(players.host,inp());
  for(const id in players){const p=players[id];
    if(p.dead){p.rs-=dt;if(p.rs<=0)spawn(p);continue}
    if(p.dx||p.dy){p.fx=p.dx;p.fy=p.dy;
      p.x=Math.max(S/2,Math.min(W-S/2,p.x+p.dx*SPD*dt));
      p.y=Math.max(S/2,Math.min(H-S/2,p.y+p.dy*SPD*dt))}
    p.cd-=dt;
    if(p.f&&p.cd<=0){p.cd=0.3;bullets.push({x:p.x+p.fx*S/2,y:p.y+p.fy*S/2,vx:p.fx*BSPD,vy:p.fy*BSPD,o:p.id,life:1.5})}}
  bullets=bullets.filter(b=>{
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;
    if(b.life<=0||b.x<0||b.y<0||b.x>W||b.y>H)return false;
    for(const id in players){const p=players[id];
      if(p.id===b.o||p.dead)continue;
      if(Math.abs(p.x-b.x)<S/2+4&&Math.abs(p.y-b.y)<S/2+4){
        if(--p.hp<=0){p.dead=1;p.rs=2}
        return false}}
    return true});
  st={t:'s',p:Object.values(players).map(p=>[p.id,Math.round(p.x),Math.round(p.y),p.fx,p.fy,p.hp,p.dead,p.col]),
      b:bullets.map(b=>[Math.round(b.x),Math.round(b.y)])};
  for(const c of conns)if(c.open)c.send(st);
},33);
setInterval(()=>{if(!isHost&&hostConn&&hostConn.open)hostConn.send(inp())},50);

/* vykreslení: jen barevné čtverečky */
function frame(){
  ctx.fillStyle='#2b3a4a';ctx.fillRect(0,0,W,H);
  ctx.strokeStyle='#000';ctx.lineWidth=8;ctx.strokeRect(0,0,W,H);
  ctx.fillStyle='#ffe44d';
  for(const b of st.b)ctx.fillRect(b[0]-4,b[1]-4,8,8);
  for(const p of st.p){
    if(p[6])continue;
    const d=disp[p[0]]||(disp[p[0]]={x:p[1],y:p[2]});
    d.x+=(p[1]-d.x)*0.4;d.y+=(p[2]-d.y)*0.4;
    ctx.fillStyle=COLS[p[7]];ctx.fillRect(d.x-S/2,d.y-S/2,S,S);
    if(p[0]===myId){ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.strokeRect(d.x-S/2,d.y-S/2,S,S)}
    ctx.fillStyle='#222';ctx.fillRect(d.x+p[3]*S/2-6,d.y+p[4]*S/2-6,12,12); // směr střelby
    ctx.fillStyle='#e33';ctx.fillRect(d.x-S/2,d.y-S/2-10,S*p[5]/3,5);
  }
  requestAnimationFrame(frame);
}
frame();
</script></body></html>
